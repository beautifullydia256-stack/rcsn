plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose' version '2.1.0'
    id 'org.jetbrains.kotlin.plugin.serialization' version '2.1.0'
    id 'dagger.hilt.android.plugin'
    id 'kotlin-parcelize'
}
apply plugin: 'com.google.devtools.ksp'

android {
    compileSdkVersion rootProject.ext.compileSdkVersion

    namespace "com.pwezacore"
    defaultConfig {
        applicationId "com.pwezacore"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables {
            useSupportLibrary true
        }
    }

    buildTypes {
        debug {
            // Uses default debug keystore (~/.android/debug.keystore)
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        compose true
    }

    packaging {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }
}

configurations.all {
    resolutionStrategy {
        force "org.jetbrains.kotlin:kotlin-metadata-jvm:2.1.0"
    }
}

dependencies {
    implementation(project(':report-core'))
    // Force Kotlin metadata version so Hilt can read Kotlin 2.1 metadata (fix "unsupported metadata version")
    implementation("org.jetbrains.kotlin:kotlin-metadata-jvm:2.1.0")
    
    // Compose
    implementation("androidx.compose.ui:ui:${rootProject.ext.composeVersion}")
    implementation("androidx.compose.ui:ui-tooling-preview:${rootProject.ext.composeVersion}")
    implementation("androidx.compose.material3:material3:1.1.2")
    implementation("androidx.compose.material:material-icons-extended:${rootProject.ext.composeVersion}")
    implementation("androidx.activity:activity-compose:1.8.1")
    
    // Navigation
    implementation("androidx.navigation:navigation-compose:${rootProject.ext.navVersion}")
    
    // Supabase (BOM for version alignment)
    implementation(platform("io.github.jan-tennert.supabase:bom:${rootProject.ext.supabaseVersion}"))
    implementation("io.github.jan-tennert.supabase:postgrest-kt")
    implementation("io.github.jan-tennert.supabase:auth-kt")
    implementation("io.github.jan-tennert.supabase:realtime-kt")
    implementation("io.github.jan-tennert.supabase:storage-kt")
    implementation("io.ktor:ktor-client-android:2.3.5")
    implementation("io.ktor:ktor-client-core:2.3.5")
    
    // Room
    implementation("androidx.room:room-runtime:${rootProject.ext.roomVersion}")
    implementation("androidx.room:room-ktx:${rootProject.ext.roomVersion}")
    ksp("androidx.room:room-compiler:${rootProject.ext.roomVersion}")
    implementation("net.zetetic:android-database-sqlcipher:4.5.2")
    implementation("androidx.sqlite:sqlite-ktx:2.4.0")
    
    // ViewModel & Lifecycle
    implementation("androidx.lifecycle:lifecycle-runtime-ktx:${rootProject.ext.lifecycleVersion}")
    implementation("androidx.lifecycle:lifecycle-viewmodel-ktx:${rootProject.ext.lifecycleVersion}")
    implementation("androidx.lifecycle:lifecycle-viewmodel-compose:${rootProject.ext.lifecycleVersion}")
    implementation("androidx.lifecycle:lifecycle-runtime-compose:${rootProject.ext.lifecycleVersion}")
    
    // Hilt (KSP; use Kotlin 2.1 to match Room/Supabase dependency metadata)
    implementation("com.google.dagger:hilt-android:${rootProject.ext.hiltVersion}")
    ksp("com.google.dagger:hilt-compiler:${rootProject.ext.hiltVersion}")
    implementation("androidx.hilt:hilt-navigation-compose:1.1.0")
    
    // DataStore
    implementation("androidx.datastore:datastore-preferences:1.0.0")
    implementation("androidx.security:security-crypto:1.1.0-alpha06")
    
    // Coroutines
    implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3")
    implementation("org.jetbrains.kotlinx:kotlinx-serialization-json:1.6.0")
    
    // Coil for image loading
    implementation("io.coil-kt:coil-compose:2.5.0")
    
    // Testing
    testImplementation("junit:junit:4.13.2")
    androidTestImplementation("androidx.test.ext:junit:1.1.5")
    androidTestImplementation("androidx.test.espresso:espresso-core:3.5.1")
    androidTestImplementation("androidx.compose.ui:ui-test-junit4:${rootProject.ext.composeVersion}")
    debugImplementation("androidx.compose.ui:ui-tooling:${rootProject.ext.composeVersion}")
    debugImplementation("androidx.compose.ui:ui-test-manifest:${rootProject.ext.composeVersion}")
}

