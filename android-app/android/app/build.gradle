plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'kotlin-kapt'
    id 'dagger.hilt.android.plugin'
    id 'kotlin-parcelize'
}

android {
    compileSdkVersion rootProject.ext.compileSdkVersion

    namespace "com.pwezacore"
    defaultConfig {
        applicationId "com.pwezacore"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables {
            useSupportLibrary true
        }
    }

    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            signingConfig signingConfigs.debug
            minifyEnabled false
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        compose true
    }

    composeOptions {
        kotlinCompilerExtensionVersion rootProject.ext.composeCompilerVersion
    }

    packaging {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }
}

dependencies {
    // Compose
    implementation("androidx.compose.ui:ui:${rootProject.ext.composeVersion}")
    implementation("androidx.compose.ui:ui-tooling-preview:${rootProject.ext.composeVersion}")
    implementation("androidx.compose.material3:material3:1.1.2")
    implementation("androidx.compose.material:material-icons-extended:${rootProject.ext.composeVersion}")
    implementation("androidx.activity:activity-compose:1.8.1")
    
    // Navigation
    implementation("androidx.navigation:navigation-compose:${rootProject.ext.navVersion}")
    
    // Supabase
    implementation("io.github.jan-tennert.supabase:postgrest-kt:${rootProject.ext.supabaseVersion}")
    implementation("io.github.jan-tennert.supabase:auth-kt:${rootProject.ext.supabaseVersion}")
    implementation("io.github.jan-tennert.supabase:realtime-kt:${rootProject.ext.supabaseVersion}")
    implementation("io.github.jan-tennert.supabase:storage-kt:${rootProject.ext.supabaseVersion}")
    implementation("io.ktor:ktor-client-android:2.3.5")
    implementation("io.ktor:ktor-client-core:2.3.5")
    
    // Room
    implementation("androidx.room:room-runtime:${rootProject.ext.roomVersion}")
    implementation("androidx.room:room-ktx:${rootProject.ext.roomVersion}")
    kapt("androidx.room:room-compiler:${rootProject.ext.roomVersion}")
    
    // ViewModel & Lifecycle
    implementation("androidx.lifecycle:lifecycle-runtime-ktx:${rootProject.ext.lifecycleVersion}")
    implementation("androidx.lifecycle:lifecycle-viewmodel-compose:${rootProject.ext.lifecycleVersion}")
    implementation("androidx.lifecycle:lifecycle-runtime-compose:${rootProject.ext.lifecycleVersion}")
    
    // Hilt
    implementation("com.google.dagger:hilt-android:${rootProject.ext.hiltVersion}")
    kapt("com.google.dagger:hilt-android-compiler:${rootProject.ext.hiltVersion}")
    implementation("androidx.hilt:hilt-navigation-compose:1.1.0")
    
    // DataStore
    implementation("androidx.datastore:datastore-preferences:1.0.0")
    
    // Coroutines
    implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3")
    
    // Coil for image loading
    implementation("io.coil-kt:coil-compose:2.5.0")
    
    // Testing
    testImplementation("junit:junit:4.13.2")
    androidTestImplementation("androidx.test.ext:junit:1.1.5")
    androidTestImplementation("androidx.test.espresso:espresso-core:3.5.1")
    androidTestImplementation("androidx.compose.ui:ui-test-junit4:${rootProject.ext.composeVersion}")
    debugImplementation("androidx.compose.ui:ui-tooling:${rootProject.ext.composeVersion}")
    debugImplementation("androidx.compose.ui:ui-test-manifest:${rootProject.ext.composeVersion}")
}

