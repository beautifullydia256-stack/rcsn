<!--
  Paste into: Supabase → Authentication → Email → Reset password (or "Recovery")

  Requires:
  - Site URL in Supabase = your live origin (e.g. https://www.pwezacore.com)
  - public/logo.png deployed at https://YOUR_DOMAIN/logo.png

  Variables: https://supabase.com/docs/guides/auth/auth-email-templates
  If {{ .SiteURL }} is empty in preview, set Authentication → URL Configuration → Site URL.
-->
<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width" />
</head>
<body style="margin:0;padding:0;background-color:#f5f5f5;font-family:'Segoe UI',Roboto,-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#f5f5f5;border-collapse:collapse;">
    <tr>
      <td align="center" style="padding:32px 16px;">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:560px;border-collapse:collapse;background-color:#ffffff;border-radius:8px;border:1px solid #dadce0;box-shadow:0 1px 2px 0 rgba(60,64,67,0.15);overflow:hidden;">
          <tr>
            <td style="height:4px;background:#1a73e8;line-height:4px;font-size:1px;">&nbsp;</td>
          </tr>
          <tr>
            <td style="padding:28px 36px 8px 36px;">
              <div style="text-align:center;padding-bottom:20px;border-bottom:1px solid #e8eaed;margin-bottom:20px;">
                <img src="{{ .SiteURL }}/logo.png" alt="PwezaCore" width="120" style="max-width:160px;height:auto;display:inline-block;border:0;" />
              </div>
              <h1 style="margin:0 0 12px 0;font-size:20px;font-weight:600;color:#202124;letter-spacing:-0.02em;">Reset your password</h1>
              <p style="margin:0 0 20px 0;font-size:15px;line-height:1.65;color:#202124;">
                We received a request to reset the password for <strong>{{ .Email }}</strong>. Click the button below to choose a new password.
              </p>
              <p style="margin:0 0 24px 0;text-align:center;">
                <a href="{{ .ConfirmationURL }}" style="display:inline-block;padding:12px 28px;background-color:#1a73e8;color:#ffffff !important;text-decoration:none;border-radius:8px;font-weight:600;font-size:15px;">Reset password</a>
              </p>
              <p style="margin:0;font-size:13px;line-height:1.5;color:#5f6368;">
                If you didn’t request this, you can ignore this email. Your password will stay the same.
              </p>
            </td>
          </tr>
          <tr>
            <td style="padding:20px 36px 28px 36px;border-top:1px solid #e8eaed;font-size:12px;line-height:1.55;color:#5f6368;">
              <div style="margin-bottom:6px;font-weight:600;color:#202124;font-size:13px;">PwezaCore</div>
              <div>School management platform</div>
            </td>
          </tr>
        </table>
        <p style="margin:16px 8px 0;font-size:11px;color:#80868b;text-align:center;">
          © PwezaCore
        </p>
      </td>
    </tr>
  </table>
</body>
</html>
